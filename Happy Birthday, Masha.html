<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Masha</title>
<style>
html,body{margin:0;height:100%;background:#0d0b16;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,225,235,.035) 0 1px,transparent 1px 4px);animation:fl 3s infinite}
@keyframes fl{0%,100%{opacity:.8}50%{opacity:.4}}
#hint{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:100%;text-align:center;font:13px system-ui,sans-serif;color:#f3c7d3;opacity:0;transition:opacity 1.5s;letter-spacing:.1em}
</style></head><body>
<canvas id="c"></canvas><div class="scan"></div><div id="hint">tap to replay ♥</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hint=document.getElementById('hint');
let W,H,dpr,N=3400,rain=false,drops=[],P=[],heart=[],tx=[],ang=0,mode='heart',seqId=0;
const phrases=[["Dear Masha,"],["happy","birthday..."],["even if it's","a bit late"]];
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);buildHeart();}
function buildHeart(){const sc=Math.min(W,H)*0.027;heart=[];
        for(let i=0;i<N;i++){const t=Math.random()*6.283,s=Math.random()<.18?1:Math.pow(Math.random(),.5),sg=Math.random()<.5?-1:1,vo=Math.random()<.22?Math.random():1;
        const x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        heart.push([x*s*sc,-y*s*sc+sc*1.2,sg*vo*9.5*sc*Math.sqrt(Math.max(0,1-s*s))+(Math.random()-.5)*sc*.5]);}
    if(!P.length)for(let i=0;i<N;i++){P.push({x:(Math.random()-.5)*W,y:(Math.random()-.5)*H,z:(Math.random()-.5)*300,h:(335+Math.random()*45)%360});}
    if(mode==='heart')tx=heart;}
function textTargets(lines){const longest=Math.max(...lines.map(l=>l.length));const fs=Math.min(W/(longest*.58),H/(lines.length*1.6),90);
    return sample(c=>{c.font='700 '+fs+'px Georgia,serif';c.textAlign='center';c.textBaseline='middle';
    lines.forEach((l,i)=>c.fillText(l,W/2,H/2+(i-(lines.length-1)/2)*fs*1.3));},Math.max(2,Math.round(fs/22)),8);}
function lipsTargets(){const s=Math.min(W*.42,H*.32);
    return sample(c=>{c.translate(W/2,H/2);c.scale(s,s);c.beginPath();c.moveTo(-1,0);
        c.bezierCurveTo(-.7,-.55,-.25,-.62,0,-.3);c.bezierCurveTo(.25,-.62,.7,-.55,1,0);
        c.bezierCurveTo(.7,.75,-.7,.75,-1,0);c.fill();
        c.globalCompositeOperation='destination-out';c.lineWidth=.045;c.beginPath();c.moveTo(-.95,0);c.bezierCurveTo(-.4,.12,.4,.12,.95,0);c.stroke();},3,40);}
function sample(draw,step,zr){const o=document.createElement('canvas'),c=o.getContext('2d');o.width=W;o.height=H;c.fillStyle='#fff';draw(c);
    const d=c.getImageData(0,0,W,H).data,pts=[];
    for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>128)pts.push([x-W/2,y-H/2,0]);
    const out=[];for(let i=0;i<N;i++){const p=pts[Math.floor(Math.random()*pts.length)]||[0,0,0];out.push([p[0]+(Math.random()-.5)*2,p[1]+(Math.random()-.5)*2,(Math.random()-.5)*zr]);}
    return out;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){const id=++seqId;hint.style.opacity=0;rain=false;mode='heart';tx=heart;await wait(3500);
    for(const ph of phrases){if(id!==seqId)return;mode='text';tx=textTargets(ph);rain=true;await wait(ph.length===1?2600:3200);}
    if(id!==seqId)return;tx=lipsRef=lipsTargets();await wait(3800);rain=false;
    if(id!==seqId)return;mode='heart';tx=heart;await wait(1500);hint.style.opacity=.7;}
let lipsRef=null;
function drawHeart(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,.35);
    ctx.bezierCurveTo(-1,-.3,-.5,-1,0,-.45);ctx.bezierCurveTo(.5,-1,1,-.3,0,.35);ctx.fill();ctx.restore();}
function frame(t){
    if(mode==='heart')ang+=.014;else{ang+=(Math.round(ang/6.283)*6.283-ang)*.08;}
    ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(13,11,22,.28)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const ca=Math.cos(ang),sa=Math.sin(ang),fl=.85+.15*Math.sin(t/90)+(Math.random()<.02?-.3:0);
    for(let i=0;i<N;i++){const p=P[i],g=tx[i];
    p.x+=(g[0]-p.x)*.07;p.y+=(g[1]-p.y)*.07;p.z+=(g[2]-p.z)*.07;
    const pu=mode==='heart'?1+.035*Math.sin(t/190):1,rx=(p.x*ca+p.z*sa)*pu,rz=-p.x*sa+p.z*ca,k=520/(520+rz+60);
    const sx=W/2+rx*k,sy=H/2+p.y*k,a=Math.max(.15,Math.min(1,k-.2))*fl;
    ctx.fillStyle='hsla('+(mode==='heart'?p.h:(tx===lipsRef?350:30))+','+(mode==='heart'?62:55)+'%,'+(mode==='heart'?Math.max(54,Math.min(90,60+(k-.9)*75)):88)+'%,'+(a*.9)+')';
    ctx.fillRect(sx,sy,1.8*k+.4,1.8*k+.4);}
    if(rain&&Math.random()<.45)drops.push({x:Math.random()*W,y:-20,s:5+Math.random()*11,v:1.2+Math.random()*2.2,ph:Math.random()*6,h:340+Math.random()*30,r:Math.random()*.6-.3});
    for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.y+=d.v;d.x+=Math.sin(d.ph+d.y/45)*.7;
        if(d.y>H+30){drops.splice(i,1);continue;}
        ctx.fillStyle='hsla('+d.h+',70%,80%,'+(.55*Math.min(1,d.y/80))+')';drawHeart(d.x,d.y,d.s,d.r+Math.sin(d.ph+d.y/60)*.3);}
        requestAnimationFrame(frame);}
addEventListener('resize',()=>{size();});
addEventListener('pointerdown',()=>{if(hint.style.opacity>0)run();});
size();requestAnimationFrame(frame);run();
</script></body></html>
